name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Dépôt PUBLIC : machines GitHub, gratuites et isolées. Jamais les runners ARC du cluster ici :
    # une PR venue d'un fork y exécuterait son code à côté du Nexus et de Vault (décision de
    # Jonas, 15/11/2026). Ces tests n'ont besoin de rien chez nous (faux serveurs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Le paquet livre AGENTS.md et llms.txt
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const f=require("./pack.json")[0].files.map(x=>x.path); for (const n of ["AGENTS.md","llms.txt","dist/index.js","dist/browser.js"]) if(!f.includes(n)) { console.error(n+" absent"); process.exit(1) }'
